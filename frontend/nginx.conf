# O HTTPS é feito pelo Caddy na frente; aqui repassamos o protocolo original.
map $http_x_forwarded_proto $proto_original {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  client_max_body_size 25m;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ~ ^/(api|admin|static)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proto_original;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /media/ { alias /media/; }

  # arquivos com hash no nome podem ficar em cache; o index.html e o service worker, não
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }

  location / { try_files $uri /index.html; }
}
